<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Teorit — школьная теория по всем предметам. Алгебра, геометрия, русский язык, литература и др. Подготовка к ОГЭ и ЕГЭ." />
    <meta name="theme-color" content="#2563eb" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Teorit — школьная теория" />
    <meta property="og:description" content="Теория по алгебре, геометрии, русскому языку и литературе. Готовка к экзаменам." />
    <meta property="og:image" content="/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Teorit — школьная теория по всем предметам</title>

    <!-- Prevent flash of wrong theme -->
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('teorit-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = theme ? theme === 'dark' : prefersDark;
          document.documentElement.classList.toggle('dark', isDark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[var(--bg-primary)] text-[var(--text-primary)] antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
